plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'net.majorkernelpanic.spydroid'
    compileSdk 35
    buildToolsVersion '35.0.0'
    // The embedded HTTP server still uses Android's legacy Apache HTTP API.
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId 'net.majorkernelpanic.spydroid'
        minSdk 14
        // Keep the legacy streaming/storage implementation compatible while
        // supporting runtime permissions and installation on current Android.
        targetSdk 28
        versionCode 1001
        versionName '10.1'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
