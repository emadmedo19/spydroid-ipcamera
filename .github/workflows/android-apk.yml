name: Build Android APK

on:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run Android Lint
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spydroid-debug-${{ github.run_number }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.run_number }}
          path: build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
