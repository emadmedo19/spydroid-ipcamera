name: Build Android APK

on:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run Android Lint
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spydroid-debug-${{ github.run_number }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-${{ github.run_number }}
          path: build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: spydroid-debug-${{ github.run_number }}
          path: dist
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.apk SHA256SUMS.txt \
            --verify-tag --prerelease \
            --title 'Spydroid 10.1 — Debug APK' \
            --notes 'Debug APK built by GitHub Actions. Build and Android Lint checks passed; live camera/audio streaming still needs device testing. Download the APK below. Corresponding source is available in the source archives attached to this tag. Each fresh runner uses its own debug signing key.'
